[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipmail"
dynamic = ["version"]
description = "Official Python SDK for the Shipmail API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Shipmail" }]
keywords = ["shipmail", "email", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://shipmail.to"
Documentation = "https://shipmail.to/docs/sdks/python"
Repository = "https://github.com/shipmail-to/shipmail-python"
Issues = "https://github.com/shipmail-to/shipmail-python/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.version]
path = "shipmail/_version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "S", "W"]
ignore = ["S311"]
